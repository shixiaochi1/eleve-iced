[package]
name = "eleve-iced"
version = "0.1.0"
edition = "2021"
authors = ["ELEVE Team"]
description = "Native desktop GUI for ELEVE Agent, built with Iced"

[workspace]

[dependencies]
# UI framework
iced = { version = "0.14", features = ["tokio", "debug", "svg", "image"] }
iced-window-chrome = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
